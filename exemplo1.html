<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utilizando CSS interno na pagina </title>
    <!-- CSS interno sempre fica no head da pagina-->
     <style>
        /* adicionando CSS a TAG p */
        p{
            color: red;
            font-size: 23px;
        }
     </style>
</head>
<body>
    <p>CSS interno da pagina</p>
    <p>teste</p>
</body>
</html>
